[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cryptovoucher"
version = "1.0.0"
description = "Encode private keys into Base62 vouchers and restore them"
readme = "README.md"
license = "MIT"
authors = [{ name = "EJ" }]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/EJ-Research/CryptoVoucher"

[tool.flit.module]
name = "CryptoVoucher"
