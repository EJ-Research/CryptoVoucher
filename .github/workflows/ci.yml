name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Generated tables match networks.json
        run: python tools/sync_registry.py --check
      - name: Assigned network codes are unchanged
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE:networks.json" 2>/dev/null; then
            git show "$BASE:networks.json" > "$RUNNER_TEMP/previous.json"
            python tools/sync_registry.py --check --previous "$RUNNER_TEMP/previous.json"
          else
            echo "No networks.json before this change"
          fi

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.16", "stable"]
    defaults:
      run:
        working-directory: Golang
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go vet ./...
      - run: go test ./...

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["14", "lts/*"]
    defaults:
      run:
        working-directory: Nodejs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s Python -v

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath
          coverage: none
      - run: php PHP/test_vectors.php
